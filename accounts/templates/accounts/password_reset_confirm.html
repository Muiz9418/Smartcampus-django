{% extends "base.html" %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<h2>Set a New Password</h2>
<div class="card" style="max-width:480px;">
    {% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Reset Password</button>
    </form>
    {% else %}
    <p style="color:var(--color-seal);">This reset link is invalid or has expired.</p>
    {% endif %}
</div>
{% endblock %}
