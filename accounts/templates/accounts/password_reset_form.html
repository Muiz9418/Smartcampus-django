{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<h2>Reset Password</h2>
<div class="card" style="max-width:480px;">
    <p style="color:var(--color-ink-soft); font-size:14px;">Enter your email and we'll send you a link to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Send Reset Link</button>
    </form>
</div>
{% endblock %}
